  name: aimqwen38vllm
  icon: https://raw.githubusercontent.com/bayerhazard/aimqwen38vllm/main/icon.png
  description: "Qwen3.8-27B (W4A16 AutoRound) served with HyperQwen — DFlash2/MTP speculative decoding, KVarN KV cache and vision on one 24 GB card."
  appid: aimqwen38vllm
  title: AIM Qwen3.8 27B
  version: '1.0.1'
  categories:
    - AI
sharedEntrances:
  - name: aimqwen38vllm
    host: sharedentrances-api
    port: 0
    title: AIM Qwen3.8 27B
    invisible: true
    authLevel: internal
    icon: https://raw.githubusercontent.com/bayerhazard/aimqwen38vllm/main/icon.png
entrances:
