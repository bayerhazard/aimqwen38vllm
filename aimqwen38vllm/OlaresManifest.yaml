olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: aimqwen38vllm
  icon: https://raw.githubusercontent.com/bayerhazard/aimqwen38vllm/main/icon.png
  description: "Qwen3.8-27B served with vLLM"
  appid: aimqwen38vllm
  title: AIM Qwen3.8 27B
  version: '26.10.2'
  categories:
    - AI
    - Vision
sharedEntrances:
  - name: aimqwen38vllm
    host: sharedentrances-api
    port: 0
    title: AIM Qwen3.8 27B
    invisible: true
    authLevel: internal
    icon: https://raw.githubusercontent.com/bayerhazard/aimqwen38vllm/main/icon.png
entrances:
  - name: aimqwen38vllm
    port: 8090
    host: download-svc
    title: AIM Qwen3.8 27B
    icon: https://raw.githubusercontent.com/bayerhazard/aimqwen38vllm/main/icon.png
    openMethod: window
    authLevel: internal
#   aimqwen38vllm — engine Deployment (== appid / Release.Name)
#   llminit        — llm-init / entrance Deployment
workloadReplicas:
  aimqwen38vllm: 1
  llminit: 1
spec:
  onlyAdmin: true
  versionName: 'dbirks/Qwen3.8-27B-W4A16-AutoRound'
  upgradeDescription: |
    26.10.2 Serving tuning. AutoRound fast variant (GPTQ-int4 lm_head + MTP with a draft
    vocabulary counted over the model's own outputs), 4 request slots and a 0.93 memory
    budget: +6.5% decode, KV pool 238,938 -> 339,823 tokens (1.70x at 200k).
  fullDescription: |
    **Model Overview**
    Qwen3.8-27B supports thinking, tool-calling, and native image understanding.

    **Key Features**
    Speculative decoding: MTP, int4 GPTQ head
    KV cache: 200k with k4v2_g128
    MAX_SEQS=4
    Performance: 95 - 117 t/s code, 70 - 99 t/s prose
    Vision: Tower is offloaded to host RAM
    OpenAI-compatible API

  developer: syv-ai
  website: https://github.com/syv-ai/HyperQwen
  sourceCode: https://github.com/syv-ai/HyperQwen
  submitter: bayerhazard
  locale:
    - en-US
    - de-DE
  license:
    - text: Apache-2.0
      url: https://github.com/syv-ai/HyperQwen/blob/main/LICENSE

  # Exclusive-GPU app: the flat resource envelope (no accelerator[] block).
  # Olares 1.12.7 patches a HAMi nvidia.com/gpumem limit to 0 on suspend, which
  # then fails validation against a lingering gpumem request; nvidia.com/gpu,
  # driven by requiredGpu: 1, avoids that.
  supportArch:
    - amd64
  requiredCpu: "4"
  limitedCpu: "16"
  requiredMemory: "23Gi"
  limitedMemory: "48Gi"
  requiredDisk: 50Mi
  limitedDisk: 500Gi
  requiredGpu: 1
permission:
  appData: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  allowMultipleInstall: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  # Fixed model declaration (this app serves one checkpoint). The Router app
  # builds its model entry from these defaults.
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://dbirks/Qwen3.8-27B-W4A16-AutoRound --include config.json"
    description: "Only config.json: HyperQwen's own prepare downloads and requantizes the weights, so llm-init must not fetch them a second time."
    regex: "^hf://"
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "qwen3.8-27b"
    description: "The served model id. Fixed by HyperQwen's launcher; llm-init waits for exactly this id on the engine's /v1/models."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "chat"
    options:
      - title: Chat
        value: chat
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "thinking,tools,vision"
    multiSelect: true
    splitter: ","
    options:
      - title: Vision
        value: vision
      - title: Tools
        value: tools
      - title: Thinking
        value: thinking
      - title: None
        value: none
    description: "The model capabilities."
  # The serving profile as one vetted choice. Olares Settings can change it on a
  # running install; the chart expands it to CTX/SPEC/PREFIX_CACHE.
  - envName: SERVING_PROFILE
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "huge"
    options:
      - title: "Fast — 64K context, bf16 KV, DFlash2 drafting"
        value: fast
      - title: "Long — 150K context, fp8 KV, MTP drafting"
        value: long
      - title: "Huge — 200K context, KVarN 4/2-bit KV, MTP drafting (default)"
        value: huge
  - envName: EXTRA_ARGS
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: ""
    description: "Extra vLLM arguments, appended last. Empty unless running an experiment; a wrong argument crashloops the engine."
  - envName: VISION
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "1"
    options:
      - title: "On"
        value: "1"
      - title: "Off"
        value: "0"
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
  - envName: GPU_MEMORY
    required: true
    default: "24Gi"
    type: string
    editable: false
    applyOnChange: false
